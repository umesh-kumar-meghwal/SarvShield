<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | SarvShield</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Inter", sans-serif;
            min-height: 100vh;
            background: radial-gradient(circle at top left, rgba(45, 212, 191, 0.10), transparent 35%),
                        radial-gradient(circle at bottom right, rgba(59, 130, 246, 0.08), transparent 35%), #070d19;
            color: #f8fafc;
        }
        .login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
        .login-card {
            width: 100%; max-width: 450px; background: rgba(15, 23, 42, 0.92);
            border: 1px solid #26344d; border-radius: 24px; padding: 42px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45); backdrop-filter: blur(14px);
        }
        .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 38px; }
        .brand-name { font-size: 22px; font-weight: 800; letter-spacing: 0.5px; }
        .brand-line { width: 38px; height: 3px; background: #2dd4bf; border-radius: 999px; }
        .login-heading { margin-bottom: 30px; }
        .eyebrow { color: #2dd4bf; font-size: 12px; font-weight: 700; letter-spacing: 1.8px; margin-bottom: 10px; }
        .login-heading h1 { font-size: 28px; line-height: 1.2; font-weight: 800; margin-bottom: 10px; }
        .subtitle { color: #94a3b8; font-size: 14px; line-height: 1.6; }
        .form-group { margin-bottom: 22px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #e2e8f0; }
        input {
            width: 100%; height: 52px; padding: 0 15px; border-radius: 12px;
            border: 1px solid #334155; background: #0a1220; color: #f8fafc; font-size: 14px; outline: none; transition: 0.2s ease;
        }
        input:focus { border-color: #2dd4bf; box-shadow: 0 0 0 3px rgba(45, 212, 191, 0.10); }
        .login-response { display: none; margin-bottom: 18px; padding: 12px 14px; border-radius: 10px; background: rgba(244, 63, 94, 0.08); border: 1px solid rgba(244, 63, 94, 0.25); color: #fb7185; font-size: 13px; }
        .success-response { background: rgba(45, 212, 191, 0.08); border-color: rgba(45, 212, 191, 0.25); color: #2dd4bf; }
        .login-btn {
            width: 100%; height: 52px; border: none; border-radius: 12px; background: #2dd4bf; color: #061018;
            font-size: 14px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.2s ease;
        }
        .login-btn:hover { background: #5eead4; box-shadow: 0 8px 25px rgba(45, 212, 191, 0.18); }
        .register-section { text-align: center; margin-top: 28px; padding-top: 24px; border-top: 1px solid #1e293b; }
        .register-link { color: #2dd4bf; font-size: 14px; font-weight: 700; text-decoration: none; }
        .register-link:hover { text-decoration: underline; }
        .step-container { display: none; }
        .step-container.active { display: block; }
    </style>
</head>

<body>
    <main class="login-page">
        <section class="login-card">
            <div class="brand">
                <span class="brand-name">SarvShield</span>
                <span class="brand-line"></span>
            </div>

            <div class="login-heading">
                <p class="eyebrow">ACCOUNT RECOVERY</p>
                <h1>Reset Password</h1>
                <p class="subtitle" id="formSubtitle">Enter your registered email address to receive a verification OTP.</p>
            </div>

            <div id="responseBox" class="login-response" role="alert"></div>

            <!-- STEP 1: Enter Email -->
            <form id="emailForm" class="step-container active">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>
                <button type="submit" id="emailBtn" class="login-btn">Send OTP</button>
            </form>

            <!-- STEP 2: Enter OTP -->
            <form id="otpForm" class="step-container">
                <div class="form-group">
                    <label for="otp">Enter 6-digit OTP</label>
                    <input type="text" id="otp" name="otp" placeholder="123456" maxlength="6" required style="letter-spacing: 4px; text-align: center; font-size: 18px; font-weight: 700;">
                </div>
                <button type="submit" id="otpBtn" class="login-btn">Verify OTP</button>
            </form>

            <!-- STEP 3: New Password -->
            <form id="passwordForm" class="step-container">
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" name="password" placeholder="Enter new password" required>
                </div>
                <button type="submit" id="passwordBtn" class="login-btn">Update Password</button>
            </form>

            <div class="register-section">
                <p>Remembered your password?</p>
                <a href="{{ url_for('login') }}" class="register-link">Sign in</a>
            </div>
        </section>
    </main>

    <script>
        let userEmail = "";

        // Helper for showing messages
        function showMsg(msg, isSuccess = false) {
            const box = $("#responseBox");
            box.removeClass("success-response");
            if (isSuccess) box.addClass("success-response");
            box.html(msg).fadeIn(150);
        }

        // STEP 1: Send OTP
        $("#emailForm").on("submit", function(e) {
            e.preventDefault();
            userEmail = $("#email").val().trim();
            if (!userEmail) { showMsg("Please enter email."); return; }

            $("#emailBtn").prop("disabled", true).text("Sending...");
            $.ajax({
                url: "/forgot-password",
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify({ step: "send_otp", email: userEmail }),
                success: function(res) {
                    showMsg(res.message, true);
                    setTimeout(() => {
                        $("#responseBox").hide();
                        $("#emailForm").removeClass("active");
                        $("#otpForm").addClass("active");
                        $("#formSubtitle").text("Enter the 6-digit OTP sent to " + userEmail);
                    }, 1000);
                },
                error: function(xhr) {
                    showMsg(xhr.responseJSON?.message || "Failed to send OTP.");
                    $("#emailBtn").prop("disabled", false).text("Send OTP");
                }
            });
        });

        // STEP 2: Verify OTP
        $("#otpForm").on("submit", function(e) {
            e.preventDefault();
            const otp = $("#otp").val().trim();
            if (otp.length !== 6) { showMsg("Please enter a valid 6-digit OTP."); return; }

            $("#otpBtn").prop("disabled", true).text("Verifying...");
            $.ajax({
                url: "/forgot-password",
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify({ step: "verify_otp", otp: otp }),
                success: function(res) {
                    showMsg(res.message, true);
                    setTimeout(() => {
                        $("#responseBox").hide();
                        $("#otpForm").removeClass("active");
                        $("#passwordForm").addClass("active");
                        $("#formSubtitle").text("Create a secure new password for your account.");
                    }, 1000);
                },
                error: function(xhr) {
                    showMsg(xhr.responseJSON?.message || "Invalid OTP.");
                    $("#otpBtn").prop("disabled", false).text("Verify OTP");
                }
            });
        });

        // STEP 3: Reset Password
        $("#passwordForm").on("submit", function(e) {
            e.preventDefault();
            const password = $("#newPassword").val().trim();
            if (password.length < 6) { showMsg("Password must be at least 6 characters."); return; }

            $("#passwordBtn").prop("disabled", true).text("Updating...");
            $.ajax({
                url: "/forgot-password",
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify({ step: "reset_password", password: password }),
                success: function(res) {
                    showMsg(res.message, true);
                    setTimeout(() => {
                        window.location.href ="/login";
                    }, 1000);
                },
                error: function(xhr) {
                    showMsg(xhr.responseJSON?.message || "Failed to reset password.");
                    $("#passwordBtn").prop("disabled", false).text("Update Password");
                }
            });
        });
    </script>
</body>
</html>
