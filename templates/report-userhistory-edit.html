<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Report · SarvShiled</title>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js">
    </script>

    <!-- Tailwind + custom config -->
    <script src="https://cdn.tailwindcss.com">
    </script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        night: "#0b1220",
                        panel: "#121a2b",
                        line: "#263349",
                        mute: "#93a0b8",
                        mint: "#3dd6c6"
                    }
                }
            }
        }
    </script>

    <!-- optional: subtle custom style for textarea / inputs -->
    <style>
        body {
            background: #0b1220;
        }

        input,
        textarea {
            background: #121a2b;
            border: 1px solid #263349;
            color: #f1f5f9;
            padding: 0.6rem 0.9rem;
            border-radius: 0.75rem;
            width: 100%;
            max-width: 480px;
            transition: border 0.2s;
            font-size: 0.95rem;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #3dd6c6;
            box-shadow: 0 0 0 3px rgba(61, 214, 198, 0.15);
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        label {
            color: #c8d0dc;
            font-weight: 500;
            font-size: 0.9rem;
            display: block;
            margin-bottom: 4px;
        }

        .btn-primary {
            background: #3dd6c6;
            color: #0b1220;
            font-weight: 600;
            padding: 0.6rem 1.8rem;
            border-radius: 9999px;
            border: none;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-primary:hover {
            background: #2ebfb0;
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: transparent;
            color: #93a0b8;
            border: 1px solid #263349;
            padding: 0.6rem 1.8rem;
            border-radius: 9999px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .btn-secondary:hover {
            background: #1e293b;
            color: #f1f5f9;
        }

        .response-box {
            margin-top: 1.5rem;
            padding: 0.75rem 1.25rem;
            border-radius: 0.75rem;
            background: #121a2b;
            border-left: 4px solid #3dd6c6;
            max-width: 480px;
            color: #e2e8f0;
        }

        .response-box.error {
            border-left-color: #f87171;
        }

        .form-row {
            margin-bottom: 1.5rem;
        }

        .form-row .field-hint {
            color: #64748b;
            font-size: 0.8rem;
            margin-top: 2px;
        }

        /* sidebar nav active state helper */
        .nav-link {
            display: block;
            border-radius: 0.75rem;
            padding: 0.6rem 1rem;
            color: #93a0b8;
            transition: background 0.15s, color 0.15s;
        }

        .nav-link:hover {
            background: rgba(30, 41, 59, 0.6);
            color: #f1f5f9;
        }

        .nav-link.active {
            background: rgba(30, 41, 59, 0.7);
            color: #ffffff;
        }

        /* layout */
        .app-layout {
            display: flex;
            min-height: 100vh;
            background: #0b1220;
            color: #f1f5f9;
        }

        .sidebar {
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid #263349;
            padding: 1.5rem;
            width: 100%;
        }

        @media (min-width: 1024px) {
            .sidebar {
                border-bottom: none;
                border-right: 1px solid #263349;
                width: 260px;
                min-height: 100vh;
                position: sticky;
                top: 0;
                height: 100vh;
            }
        }

        .main-content {
            flex: 1;
            padding: 2rem 1.5rem;
        }

        @media (min-width: 640px) {
            .main-content {
                padding: 2.5rem 3rem;
            }
        }
    </style>
</head>

<body>

    <div class="app-layout">

        <!-- ========== SIDEBAR ========== -->
        <aside class="sidebar">
            <div class="text-xl font-bold tracking-wide">
                Scam<span class="text-mint">Shield</span>
            </div>
            <p class="text-mute text-xs mt-1 mb-7">Admin control panel</p>

            <nav class="space-y-1">
                <a class="nav-link" href="/admin-dashboard">Dashboard</a>
                <a class="nav-link" href="/user-show">Manage Users</a>
                <a class="nav-link" href="/admin-show">Show Admins</a>
                <a class="nav-link" href="/admin-register">Add Admin</a>
            </nav>

            <a class="mt-6 block rounded-xl border border-line px-3 py-2.5 text-center text-rose-400 hover:bg-rose-500/10 transition"
            href="/logout">
            Logout
        </a>
    </aside>

    <!-- ========== MAIN CONTENT ========== -->
    <main class="main-content">

        <h2 class="text-2xl font-semibold tracking-tight mb-6">Edit Report</h2>

        <!-- ===== FORM ===== -->
        <form id="editReportForm" class="max-w-xl">

            <!-- PHONE -->
            <div class="form-row">
                <label for="phoneInput">Phone</label>
                <input type="text" id="phoneInput" name="phone"
                value="{{ report.phone }}"
                required />
            </div>

            <!-- LINK -->
            <div class="form-row">
                <label for="linkInput">Link</label>
                <input type="text" id="linkInput" name="link"
                value="{{ report.link }}"
                required />
            </div>

            <!-- REASON -->
            <div class="form-row">
                <label for="reasonInput">Reason</label>
                <textarea id="reasonInput" name="reason" required>{{ report.reason }}</textarea>
            </div>

            <!-- BUTTONS -->
            <div class="flex flex-wrap items-center gap-3 mt-2">
                <button type="submit" id="updateBtn" class="btn-primary">
                    Update Report
                </button>

                <a href="javascript:history.back()">
                    <button type="button" class="btn-secondary">
                        Back
                    </button>
                </a>
            </div>

        </form>

        <!-- ===== RESPONSE ===== -->
        <div id="updateResponse"></div>

    </main>

</div>

<!-- ========== SCRIPT ========== -->
<script>
    $(function() {

        $("#editReportForm").on("submit", function(e) {
            e.preventDefault();

            const $btn = $("#updateBtn");
            $btn.prop("disabled", true).text("Updating...");

            $.ajax({
                url: window.location.pathname,
                type: "POST",
                data: $(this).serialize(),

                success: function(response) {
                    const $box = $("#updateResponse");
                    $box.html(
                        '<div class="response-box">' +
                        response.message +
                        '</div>'
                    );

                    if (response.success) {
                        setTimeout(function() {
                            history.back();
                        }, 1000);
                    }
                },

                error: function(xhr) {
                    let msg = "Something went wrong.";
                    if (xhr.responseJSON && xhr.responseJSON.message) {
                        msg = xhr.responseJSON.message;
                    }

                    $("#updateResponse").html(
                        '<div class="response-box error">' +
                        msg +
                        '</div>'
                    );
                },

                complete: function() {
                    $btn.prop("disabled", false).text("Update Report");
                }
            });
        });

    });
</script>

</body>

</html>
